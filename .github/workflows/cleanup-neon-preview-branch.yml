name: Cleanup Neon preview branch

# The Vercel integration creates a Neon branch named preview/<git-branch>.
# Vercel only removes it when the deployment is deleted (up to ~6 months),
# so delete it as soon as the PR is closed or merged.
on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
